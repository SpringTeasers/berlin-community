<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Berlin Community Site — a community guide to Berlin, Connecticut">
  <title>Berlin Community Site — a community guide to Berlin, Connecticut</title>
  <!--
    Open Graph card, 1200 x 630 (logo-spec.md §4).
    Flat slate-900 ground. No invented fact, no population figure, no date,
    no seal and no claim of official status. Placeholder copy only.
    Playwright/similar rasterises this to og-image.png at 1x.
  -->
  <defs>
    <linearGradient id="tint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A4056"/>
      <stop offset="1" stop-color="#2F6C8A"/>
    </linearGradient>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="630" fill="#122E3F"/>

  <!-- Left: horizontal lockup, cream variant, 64px margins, ~40px tall mark -->
  <g transform="translate(64,64)">
    <g transform="translate(0,4) scale(0.40)">
      <path fill="#FBF8F2" d="M14 88 C30 74, 42 50, 50 22 L46.4 22 C38.5 49.6, 27.1 72.4, 10.7 84.9 Z"/>
      <path fill="#FBF8F2" d="M86 88 C70 74, 58 50, 50 22 L53.6 22 C61.5 49.6, 72.9 72.4, 89.3 84.9 Z"/>
      <path fill="#C9A227" d="M50 92 C50 68, 50 44, 50 22 L46.5 22 C46.5 44, 46.5 68, 46.5 92 Z"/>
    </g>
    <text x="52" y="20" font-family="'Source Serif 4','Source Serif Pro',Georgia,serif" font-size="30" font-weight="600" letter-spacing="-0.3" fill="#FBF8F2">BERLIN</text>
    <rect x="52" y="28" width="76" height="2" fill="#C9A227"/>
    <text x="52" y="48" font-family="Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="1.8" fill="#9AA7B8">CONNECTICUT</text>
  </g>

  <!-- Brass fork rule: centre stroke rotated horizontal, two slate ticks at left -->
  <g transform="translate(64,300)">
    <path fill="#FBF8F2" d="M0 0 L10 -26 L4 -30 L-6 -6 Z"/>
    <path fill="#FBF8F2" d="M2 14 L12 40 L6 44 L-4 20 Z"/>
    <rect x="14" y="-2" width="112" height="3" fill="#C9A227"/>
  </g>

  <!-- Right: photo placeholder — graded tint panel, never a stock photo -->
  <g transform="translate(760,190)">
    <rect width="376" height="250" rx="8" fill="url(#tint)"/>
    <g fill="none" stroke="#FBF8F2" stroke-width="2" opacity="0.32">
      <rect x="3" y="3" width="370" height="244" rx="6" stroke-dasharray="7 7"/>
    </g>
    <g transform="translate(188,112)" opacity="0.3">
      <rect x="-26" y="-20" width="52" height="40" rx="4" fill="none" stroke="#FBF8F2" stroke-width="2.4"/>
      <circle cx="-8" cy="-4" r="4" fill="#FBF8F2"/>
      <path d="M-24 16 L-8 2 L4 12 L14 3 L26 16" fill="none" stroke="#FBF8F2" stroke-width="2.4" stroke-linejoin="round"/>
    </g>
    <text x="188" y="234" text-anchor="middle" font-family="Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13" fill="#D8E4E6" opacity="0.75">[Placeholder: photo — town centre]</text>
  </g>

  <!-- Lower third: one-line description placeholder -->
  <text x="64" y="430" font-family="Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" fill="#D8E4E6">A community guide to Berlin, Connecticut — history, places, businesses and services.</text>
  <text x="64" y="468" font-family="Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="16" fill="#9AA7B8">[Placeholder: one-line town description]</text>

  <!-- Bottom-left: wordmark at reduced opacity -->
  <g opacity="0.4">
    <text x="64" y="576" font-family="'Source Serif 4','Source Serif Pro',Georgia,serif" font-size="22" font-weight="600" letter-spacing="-0.2" fill="#FBF8F2">BERLIN</text>
    <rect x="64" y="585" width="52" height="2" fill="#C9A227"/>
    <text x="64" y="603" font-family="Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="1.6" fill="#9AA7B8">CONNECTICUT</text>
  </g>

  <!-- Honesty line: not official -->
  <text x="1136" y="576" text-anchor="end" font-family="Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="13" fill="#9AA7B8">An independent community guide · not an official town website</text>
</svg>
